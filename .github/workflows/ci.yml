name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ayni dala arka arkaya push edilirse eski kosuyu iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Ruff + pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur (pip onbellegi ile)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      # "not slow": slow isaretli testler gercek Ollama'ya, gercek MCP stdio alt
      # surecine ve diske persist eden ChromaDB'ye baglanir; CI'da calistirilmaz.
      # Geri kalan testler dis servise hic dokunmaz (DB tarafi sqlite:///:memory:).
      - name: pytest (slow disinda)
        # Ruff kirmizi olsa bile test sonucunu da gormek icin calissin.
        if: success() || failure()
        run: pytest -m "not slow" -q
