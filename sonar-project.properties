# SonarCloud yapilandirmasi. Analiz .github/workflows/ci.yml icindeki
# SonarSource/sonarqube-scan-action adiminda calisir.
# sonar.host.url ve SONAR_TOKEN workflow'da env olarak veriliyor.

sonar.projectKey=semaakyavuz_Document-Intelligence-Agent
sonar.organization=semaakyavuz

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Gercek kaynak kod. frontend/ dahil: JS tarafinda da denetlenecek sey var
# (nitekim innerHTML kaynakli iki XSS bu kod tabaninda gercekten cikti).
sonar.sources=app,scripts,frontend
sonar.tests=tests

# Uretilen/indirilen/ikili icerik analiz disi.
sonar.exclusions=\
  frontend/samples/**,\
  data/**,\
  graphify-out/**,\
  augraphy_cache/**,\
  **/__pycache__/**

# Kapsam raporu: CI'daki pytest adimi --cov=app --cov-report=xml ile uretiyor.
sonar.python.coverage.reportPaths=coverage.xml

# KAPSAM PAYDASI. coverage.xml sadece app/ verisi tasiyor; scripts/ ve frontend/
# icin hicbir kapsam verisi yok, dolayisiyla Sonar onlari "%0 kapsanmis" sayip
# orani asagi cekiyordu (app/ tek basina %97 iken panelde %40 goruluyordu:
# scripts/ 1827 satirla app/ kadar buyuk, frontend/ ayrica ~640 satir JS).
#
# Bunlari sonar.sources'tan CIKARMIYORUZ - o zaman Sonar oradaki hata/guvenlik
# bulgularini da kaybederdi (JS tarafinda gercekten XSS cikmisti). Sadece kapsam
# metriginin disinda tutuluyorlar: scripts/ elle calistirilan CLI araclari,
# frontend/ ise JS ve zaten pytest kapsaminda degil.
sonar.coverage.exclusions=scripts/**,frontend/**
