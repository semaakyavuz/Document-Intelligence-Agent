# SonarCloud yapilandirmasi. Analiz .github/workflows/ci.yml icindeki
# SonarSource/sonarqube-scan-action adiminda calisir.
# sonar.host.url ve SONAR_TOKEN workflow'da env olarak veriliyor.

sonar.projectKey=semaakyavuz_Document-Intelligence-Agent
sonar.organization=semaakyavuz

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Gercek kaynak kod. frontend/ dahil: JS tarafinda da denetlenecek sey var
# (nitekim innerHTML kaynakli iki XSS bu kod tabaninda gercekten cikti).
sonar.sources=app,scripts,frontend
sonar.tests=tests

# Uretilen/indirilen/ikili icerik analiz disi.
sonar.exclusions=\
  frontend/samples/**,\
  data/**,\
  graphify-out/**,\
  augraphy_cache/**,\
  **/__pycache__/**

# Kapsam raporu: CI'daki pytest adimi --cov=app --cov-report=xml ile uretiyor.
# Kapsam yalnizca app/ icin olculuyor (scripts/ ve tests/ haric).
sonar.python.coverage.reportPaths=coverage.xml
