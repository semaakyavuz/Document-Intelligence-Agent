<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Fatura Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
<!-- Tam surume sabit: "@4" kayan bir major surum, CDN'den habersiz bir minor/patch
     guncellemesi paneli sessizce bozabilir ya da degistirebilir. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<style>
  /* Renk/font tokenlari css/design-system.css'ten geliyor (--bg, --surface, --ink, --muted,
     --accent, --ok, --warn, --bad, --line, --font-*) - burada sadece bu sayfaya ozgu duzen var. */
  body { padding: 2rem 1rem; }
  /* max-width/margin design-system.css'teki .wrap'tan geliyor (ana sayfa ile ayni genislik). */
  .wrap { padding: 0; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.5rem; }
  /* Sayfa basligi hero olcusunde degil, bolum basligi olcusunde. */
  h1 { font-size: 1.5rem; letter-spacing: -0.02em; margin: 0; }
  header a { color: var(--accent); text-decoration: none; font-size: 0.85rem; }

  .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
  .card h2 { font-family: var(--font-sans); font-size: 0.95rem; margin: 0 0 0.75rem; color: var(--muted); text-transform: none; letter-spacing: normal; }
  .card canvas { max-height: 220px; }

  #filterInput {
    width: 100%;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 0.75rem;
  }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 0.6rem 0.75rem; font-size: 0.85rem; border-bottom: 1px solid var(--line); }
  th { font-family: var(--font-sans); background: var(--bg); color: var(--muted); font-weight: 600; }
  td { font-family: var(--font-mono); }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge.ok { background: color-mix(in srgb, var(--ok) 14%, var(--bg)); color: var(--ok); }
  .badge.warn { background: color-mix(in srgb, var(--bad) 14%, var(--bg)); color: var(--bad); }
  #emptyMsg { color: var(--muted); font-size: 0.85rem; padding: 1rem; text-align: center; display: none; }
  #loadError { color: var(--bad); font-size: 0.9rem; display: none; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fatura Paneli</h1>
    <a href="/static/upload.html">+ Yeni fatura yükle</a>
  </header>

  <div id="loadError">Kayıtlar yüklenemedi.</div>

  <div class="charts">
    <div class="card">
      <h2>Gün bazında işlenen fatura sayısı</h2>
      <canvas id="dailyChart"></canvas>
    </div>
    <div class="card">
      <h2>Geçerli / Anomalili oranı</h2>
      <canvas id="validityChart"></canvas>
    </div>
  </div>

  <input type="text" id="filterInput" placeholder="Satıcı adına göre filtrele...">

  <table>
    <thead>
      <tr>
        <th>Fatura No</th>
        <th>Satıcı</th>
        <th>Tutar</th>
        <th>Anomali</th>
        <th>İşlenme Tarihi</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div id="emptyMsg">Filtreye uyan kayıt yok.</div>
</div>

<script>
let allRows = [];

async function loadInvoices() {
  try {
    const response = await fetch("/invoices?limit=100");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    allRows = await response.json();
  } catch (err) {
    document.getElementById("loadError").style.display = "block";
    return;
  }
  renderTable(allRows);
  renderCharts(allRows);
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function renderTable(rows) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  document.getElementById("emptyMsg").style.display = rows.length === 0 ? "block" : "none";

  /* Hucreler innerHTML ile degil textContent ile yaziliyor: invoice_no/seller_name
     gibi alanlar fatura GORSELINDEN cikariliyor, yani icerigi disaridan belirlenebilir.
     Kacissiz sablona konuldugunda kotu niyetli bir fatura kalici (stored) XSS'e donusuyordu. */
  for (const row of rows) {
    const tr = document.createElement("tr");

    const cells = [
      row.invoice_no ?? "-",
      row.seller_name ?? "-",
      row.grand_total != null ? row.grand_total + " TL" : "-",
      String(row.anomaly_count),
      formatDate(row.processed_at),
    ];
    for (const value of cells) {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    }

    const statusTd = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = row.is_valid ? "badge ok" : "badge warn";
    badge.textContent = row.is_valid ? "Geçerli" : "Anomali var";
    statusTd.appendChild(badge);
    tr.appendChild(statusTd);

    tbody.appendChild(tr);
  }
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderCharts(rows) {
  const dailyCounts = {};
  let validCount = 0;
  let invalidCount = 0;

  for (const row of rows) {
    const day = row.processed_at.slice(0, 10);
    dailyCounts[day] = (dailyCounts[day] || 0) + 1;
    if (row.is_valid) validCount++; else invalidCount++;
  }

  const days = Object.keys(dailyCounts).sort();
  const accent = cssVar("--accent");
  const ok = cssVar("--ok");
  const bad = cssVar("--bad");
  const muted = cssVar("--muted");
  const line = cssVar("--line");

  new Chart(document.getElementById("dailyChart"), {
    type: "bar",
    data: {
      labels: days,
      datasets: [{ label: "Fatura sayısı", data: days.map((d) => dailyCounts[d]), backgroundColor: accent }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0, color: muted }, grid: { color: line } },
        x: { ticks: { color: muted }, grid: { color: line } },
      },
    },
  });

  new Chart(document.getElementById("validityChart"), {
    type: "doughnut",
    data: {
      labels: ["Geçerli", "Anomalili"],
      datasets: [{ data: [validCount, invalidCount], backgroundColor: [ok, bad] }],
    },
    options: { responsive: true, plugins: { legend: { labels: { color: muted } } } },
  });
}

document.getElementById("filterInput").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = q ? allRows.filter((r) => (r.seller_name || "").toLowerCase().includes(q)) : allRows;
  renderTable(filtered);
});

loadInvoices();
</script>
</body>
</html>
