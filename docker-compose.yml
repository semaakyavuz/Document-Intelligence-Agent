services:
  postgres:
    image: postgres:16
    container_name: document-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host tarafi 5434: bu makinede zaten "my-postgres" adli baska bir projeden kalma
      # container 5433'u kullaniyor, catismamasi icin 5434 secildi. Container ici hep 5432.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
